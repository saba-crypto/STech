<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - STech</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link
      rel="stylesheet"
      href="../styles/pages/reset-password/reset-password.css"
    />
  </head>
  <body>
    <main class="reset-password-page">
      <div class="reset-password-container">
        <a
          href="../index.html"
          class="back-home-link"
          aria-label="Back to the home page"
        >
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to the home page</span>
        </a>

        <section class="banner-section" aria-label="Brand introduction">
          <div class="section-container banner-container">
            <div class="banner-content">
              <a href="../index.html" class="logo" aria-label="STech Home">
                <svg
                  viewBox="0 0 24 24"
                  width="40"
                  height="40"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
              </a>
              <h1 class="banner-title">STEP TECH</h1>
              <p class="banner-description">
                Create a new password for your account. Make sure it's secure
                and memorable.
              </p>
              <div class="security-tips" aria-label="Security tips">
                <div class="tip-item">
                  <div class="tip-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                  <span>Use at least 8 characters</span>
                </div>

                <div class="tip-item">
                  <div class="tip-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                  <span>Include uppercase &amp; lowercase</span>
                </div>

                <div class="tip-item">
                  <div class="tip-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </div>
                  <span>Add numbers &amp; special characters</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="form-section" aria-label="Reset password form">
          <div class="section-container form-container">
            <div class="reset-card">
              <header class="header-section">
                <div class="icon-wrapper" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="28"
                    height="28"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
                    ></path>
                  </svg>
                </div>
                <h2 class="form-title">Reset Password</h2>
                <p class="subtitle">Enter your new password below 🔐</p>
              </header>

              <form class="reset-form" action="#" method="POST">
                <div class="form-group">
                  <label class="form-label" for="reset-password"
                    >New password</label
                  >
                  <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                      <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <rect
                          x="3"
                          y="11"
                          width="18"
                          height="11"
                          rx="2"
                          ry="2"
                        ></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                      </svg>
                    </span>
                    <input
                      type="password"
                      id="reset-password"
                      name="password"
                      class="form-input input-with-icon"
                      placeholder="New password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="toggle-password"
                      aria-label="Toggle password visibility"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path
                          d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label" for="confirm-password"
                    >Confirm new password</label
                  >
                  <div class="input-wrapper">
                    <span class="input-icon" aria-hidden="true">
                      <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path
                          d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                        ></path>
                      </svg>
                    </span>
                    <input
                      type="password"
                      id="confirm-password"
                      name="confirmPassword"
                      class="form-input input-with-icon"
                      placeholder="Confirm new password"
                      autocomplete="new-password"
                      required
                    />
                    <button
                      type="button"
                      class="toggle-password"
                      aria-label="Toggle confirm password visibility"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path
                          d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="password-strength">
                  <div class="strength-bar">
                    <div class="strength-fill"></div>
                  </div>
                  <span class="strength-text"></span>
                </div>

                <button type="submit" class="submit-button">
                  <span class="button-content">
                    <svg
                      viewBox="0 0 24 24"
                      width="18"
                      height="18"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Reset Password</span>
                  </span>
                </button>

                <p class="footer-text">
                  Remember your password?
                  <a href="./login.html" class="login-link">Sign in</a>
                </p>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
