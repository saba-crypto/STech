<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - STech</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/profile/profile.css" />
  </head>
  <body>
    <header class="header"></header>

    <main class="profile-page">
      <section class="profile-section" aria-label="User Profile">
        <div class="section-container profile-container">
          <div class="profile-layout">
            <aside class="profile-sidebar" aria-label="Profile navigation">
              <div class="user-card"></div>

              <nav class="profile-nav" aria-label="Account navigation">
                <a
                  href="./profile.html"
                  class="nav-item active"
                  aria-current="page"
                >
                  <div class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                      ></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </div>
                  <span>My Profile</span>
                </a>

                <a href="#" class="nav-item">
                  <div class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
                      ></path>
                      <line x1="3" y1="6" x2="21" y2="6"></line>
                      <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                  </div>
                  <span>Cart</span>
                </a>

                <a href="#" class="nav-item">
                  <div class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                      ></path>
                    </svg>
                  </div>
                  <span>Favorites</span>
                </a>

                <a href="#" class="nav-item">
                  <div class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="12" r="3"></circle>
                      <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                      ></path>
                    </svg>
                  </div>
                  <span>Settings</span>
                </a>

                <div class="nav-divider" role="separator"></div>

                <button type="button" class="nav-item logout">
                  <div class="nav-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                      <polyline points="16 17 21 12 16 7"></polyline>
                      <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                  </div>
                  <span>Logout</span>
                </button>
              </nav>
            </aside>

            <div class="profile-content">
              <header class="content-header">
                <div class="header-text">
                  <h1 class="page-title">My Profile</h1>
                  <p class="page-subtitle">
                    Manage your personal information and preferences
                  </p>
                </div>
              </header>

              <form class="profile-form">
                <!-- Profile Picture Card -->
                <div class="form-card">
                  <div class="card-header">
                    <h3>
                      <svg
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <rect
                          x="3"
                          y="3"
                          width="18"
                          height="18"
                          rx="2"
                          ry="2"
                        ></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                      </svg>
                      <span>Profile Picture</span>
                    </h3>
                  </div>
                  <div class="card-content">
                    <div class="profile-picture-section">
                      <div class="current-picture">
                        <img class="picture-placeholder" alt="user name" />
                        <div class="picture-overlay" aria-hidden="true">
                          <svg
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path
                              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                            ></path>
                            <circle cx="12" cy="13" r="4"></circle>
                          </svg>
                        </div>
                      </div>
                      <div class="picture-actions">
                        <div class="picture-info">
                          <h4>Upload your photo</h4>
                          <p>Enter a URL to your profile picture</p>
                        </div>
                        <div class="form-group picture-url-input form-input">
                          <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                              <svg
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                              >
                                <path
                                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                                ></path>
                                <path
                                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                                ></path>
                              </svg>
                            </span>
                            <input
                              type="url"
                              id="picture-url"
                              name="pictureUrl"
                              class="form-input input-with-icon"
                              placeholder="https://example.com/avatar.jpg"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Personal Information Card -->
                <div class="form-card">
                  <div class="card-header">
                    <h3>
                      <svg
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path
                          d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                        ></path>
                        <circle cx="12" cy="7" r="4"></circle>
                      </svg>
                      <span>Personal Information</span>
                    </h3>
                  </div>
                  <div class="card-content">
                    <div class="form-grid">
                      <div class="form-group">
                        <label class="form-label required" for="first-name"
                          >First Name</label
                        >
                        <div class="input-wrapper">
                          <span class="input-icon" aria-hidden="true">
                            <svg
                              viewBox="0 0 24 24"
                              width="18"
                              height="18"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <path
                                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                              ></path>
                              <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                          </span>
                          <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            class="form-input input-with-icon"
                            placeholder="Enter your first name"
                            value="Saba"
                            required
                          />
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="form-label required" for="last-name"
                          >Last Name</label
                        >
                        <div class="input-wrapper">
                          <span class="input-icon" aria-hidden="true">
                            <svg
                              viewBox="0 0 24 24"
                              width="18"
                              height="18"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <path
                                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                              ></path>
                              <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                          </span>
                          <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            class="form-input input-with-icon"
                            placeholder="Enter your last name"
                            value="Gochishvili"
                            required
                          />
                        </div>
                      </div>

                      <div class="form-group full-width">
                        <label class="form-label" for="profile-email"
                          >Email Address</label
                        >
                        <div class="input-wrapper">
                          <span class="input-icon" aria-hidden="true">
                            <svg
                              viewBox="0 0 24 24"
                              width="18"
                              height="18"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <rect
                                x="2"
                                y="4"
                                width="20"
                                height="16"
                                rx="2"
                              ></rect>
                              <path
                                d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"
                              ></path>
                            </svg>
                          </span>
                          <input
                            type="email"
                            id="profile-email"
                            name="email"
                            class="form-input input-with-icon readonly-input"
                            placeholder="Email address"
                            value="sabagochishvili@proton.me"
                            readonly
                          />
                          <span
                            class="locked-badge"
                            title="Email cannot be changed"
                            aria-label="Email cannot be changed"
                          >
                            <svg
                              viewBox="0 0 24 24"
                              width="14"
                              height="14"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              aria-hidden="true"
                            >
                              <rect
                                x="3"
                                y="11"
                                width="18"
                                height="11"
                                rx="2"
                                ry="2"
                              ></rect>
                              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                          </span>
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="form-label" for="date-of-birth"
                          >Date of Birth</label
                        >
                        <div class="input-wrapper">
                          <span class="input-icon" aria-hidden="true">
                            <svg
                              viewBox="0 0 24 24"
                              width="18"
                              height="18"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <rect
                                x="3"
                                y="4"
                                width="18"
                                height="18"
                                rx="2"
                                ry="2"
                              ></rect>
                              <line x1="16" y1="2" x2="16" y2="6"></line>
                              <line x1="8" y1="2" x2="8" y2="6"></line>
                              <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                          </span>
                          <input
                            type="date"
                            id="date-of-birth"
                            name="dateOfBirth"
                            class="form-input input-with-icon"
                          />
                        </div>
                      </div>

                      <div class="form-group">
                        <label class="form-label" for="phone-number"
                          >Phone Number</label
                        >
                        <div class="input-wrapper">
                          <span class="input-icon" aria-hidden="true">
                            <svg
                              viewBox="0 0 24 24"
                              width="18"
                              height="18"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            >
                              <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                              ></path>
                            </svg>
                          </span>
                          <input
                            type="tel"
                            id="phone-number"
                            name="phoneNumber"
                            class="form-input input-with-icon"
                            placeholder="+995 555 123 456"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Address Card -->
                <div class="form-card">
                  <div class="card-header">
                    <h3>
                      <svg
                        viewBox="0 0 24 24"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path
                          d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                        ></path>
                        <circle cx="12" cy="10" r="3"></circle>
                      </svg>
                      <span>Address</span>
                    </h3>
                  </div>
                  <div class="card-content">
                    <div class="form-group">
                      <label class="form-label" for="street-address"
                        >Street Address</label
                      >
                      <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                          <svg
                            viewBox="0 0 24 24"
                            width="18"
                            height="18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path
                              d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                            ></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                          </svg>
                        </span>
                        <input
                          type="text"
                          id="street-address"
                          name="address"
                          class="form-input input-with-icon"
                          placeholder="Enter your street address"
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                  <button type="button" class="btn-discard" disabled>
                    <span class="btn-icon" aria-hidden="true">
                      <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                      </svg>
                    </span>
                    <span>Discard</span>
                  </button>

                  <button type="submit" class="btn-save">
                    <span class="btn-icon" aria-hidden="true">
                      <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polyline points="20 6 9 17 4 12"></polyline>
                      </svg>
                    </span>
                    <span>Save Changes</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-default">
      <a target="_blank" href="https://github.com/saba-crypto" class="logo">
        <span class="logo-text">Created by Saba himself</span>
      </a>
    </footer>
    <script type="module" src="../scripts/paged/profile/profile.js"></script>
  </body>
</html>
