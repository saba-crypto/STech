<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopTop</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/shop/shop.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a
          class="site-header__brand"
          href="../index.html"
          aria-label="STEP TECH home"
        >
          <span class="site-header__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
          </span>
          <span class="site-header__brand-name">STECH</span>
        </a>

        <nav
          class="site-header__nav"
          id="site-menu"
          aria-label="Primary navigation"
        >
          <ul class="site-header__nav-list">
            <li>
              <a
                class="site-header__nav-link"
                href="../index.html"
                aria-current="page"
                >Home</a
              >
            </li>
            <li>
              <a
                class="site-header__nav-link site-header__nav-link--active"
                href="#"
                >Shop</a
              >
            </li>
            <li>
              <a
                class="site-header__nav-link site-header__nav-link--with-icon"
                href="#section3"
                aria-label="Browse product categories"
              >
                <span>Categories</span>
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path d="m4 6 4 4 4-4" />
                </svg>
              </a>
            </li>
          </ul>
        </nav>

        <form
          class="site-header__search"
          role="search"
          aria-label="Product search"
        >
          <label class="site-header__search-label" for="site-search"
            >Search products</label
          >
          <input
            id="site-search"
            type="search"
            name="search"
            placeholder="Search products..."
            autocomplete="off"
          />
        </form>

        <div class="site-header__actions" aria-label="User shortcuts">
          <button
            class="site-header__icon-btn site-header__icon-btn--favorite"
            type="button"
            aria-label="View wishlist"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M20.8 5.9a5.2 5.2 0 0 0-7.4 0L12 7.3l-1.4-1.4a5.2 5.2 0 1 0-7.4 7.4L12 22l8.8-8.7a5.2 5.2 0 0 0 0-7.4Z"
              />
            </svg>
          </button>
          <button
            class="site-header__icon-btn"
            type="button"
            aria-label="View shopping cart"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M3 4h2l2.1 11.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L20 8H6"
              />
              <path d="M10 21h.01" />
              <path d="M17 21h.01" />
            </svg>
          </button>
          <button
            class="site-header__profile"
            type="button"
            aria-label="Open user profile"
          >
            <span aria-hidden="true">JS</span>
          </button>
          <button
            class="site-header__menu"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
          >
            <span aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section id="section1">
        <div class="section-container">
          <div class="container">
            <div class="header-content">
              <div class="breadcrumb">
                <a href="../index.html">Home</a
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
                <span>Shop</span>
              </div>
              <h1 class="page-heading">All Products</h1>
              <p class="page-description">
                Discover our full range of tech products
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="section2">
        <div class="section-container">
          <aside class="filter-sidebar">
            <div class="sidebar-header">
              <h3>Filters</h3>
            </div>
            <div class="filters-content">
              <div class="filter-group">
                <h4 class="filter-title">Categories</h4>
                <div class="filter-options">
                  <label class="filter-option"
                    ><input type="radio" name="category" value="1" />
                    <span class="option-label">Laptops</span
                    ><span class="option-count">6</span>
                  </label>
                  <label class="filter-option"
                    ><input type="radio" name="category" value="2" /><span
                      class="option-label"
                      >Smartphones</span
                    ><span class="option-count">7</span> </label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="3" /><span
                      class="option-label"
                      >Monitors</span
                    ><span class="option-count">4</span></label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="4" /><span
                      class="option-label"
                      >Keyboards &amp; Mice</span
                    ><span class="option-count">5</span></label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="5" /><span
                      class="option-label"
                      >Headphones &amp; Audio</span
                    ><span class="option-count">5</span></label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="6" /><span
                      class="option-label"
                      >Graphics Cards</span
                    ><span class="option-count">4</span></label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="7" /><span
                      class="option-label"
                      >Storage</span
                    ><span class="option-count">5</span></label
                  ><label class="filter-option"
                    ><input type="radio" name="category" value="8" /><span
                      class="option-label"
                      >Networking</span
                    ><span class="option-count">4</span></label
                  >
                </div>
              </div>
              <div class="filter-group">
                <h4 class="filter-title">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <polygon
                      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                    ></polygon>
                  </svg>
                  Min Rating
                </h4>
                <div
                  role="group"
                  aria-label="Minimum star rating filter"
                  class="rating-options"
                >
                  <button
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 4 &amp; up"
                  >
                    <span aria-hidden="true" class="stars-display"
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star">★</span
                      ><!----></span
                    ><span class="rating-text">4 &amp; up</span></button
                  ><button
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 3 &amp; up"
                  >
                    <span aria-hidden="true" class="stars-display"
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star">★</span><span class="star">★</span
                      ><!----></span
                    ><span class="rating-text">3 &amp; up</span></button
                  ><button
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 2 &amp; up"
                  >
                    <span aria-hidden="true" class="stars-display"
                      ><span class="star star-filled">★</span
                      ><span class="star star-filled">★</span
                      ><span class="star">★</span><span class="star">★</span
                      ><span class="star">★</span
                      ><!----></span
                    ><span class="rating-text">2 &amp; up</span></button
                  ><button
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 1 &amp; up"
                  >
                    <span aria-hidden="true" class="stars-display"
                      ><span class="star star-filled">★</span
                      ><span class="star">★</span><span class="star">★</span
                      ><span class="star">★</span><span class="star">★</span
                      ><!----></span
                    ><span class="rating-text">1 &amp; up</span></button
                  ><!---->
                </div>
              </div>
              <div class="filter-group">
                <h4 class="filter-title">Price Range</h4>
                <div class="price-inputs">
                  <div class="price-input">
                    <label>Min</label
                    ><input
                      type="number"
                      placeholder="$0"
                      class="ng-untouched ng-pristine ng-valid"
                    />
                  </div>
                  <span class="price-separator">-</span>
                  <div class="price-input">
                    <label>Max</label
                    ><input
                      type="number"
                      placeholder="$9999"
                      class="ng-untouched ng-pristine ng-valid"
                    />
                  </div>
                </div>
              </div>
              <div class="filter-group">
                <h4 class="filter-title">Brand</h4>
                <div class="filter-search">
                  <input
                    type="text"
                    placeholder="Search brands..."
                    class="ng-untouched ng-pristine ng-valid"
                  />
                </div>
              </div>
              <div class="filter-group">
                <h4 class="filter-title">Availability</h4>
                <label class="filter-option checkbox"
                  ><input type="checkbox" /><span class="checkbox-mark"></span
                  ><span class="option-label">In Stock Only</span></label
                >
              </div>
              <button class="clear-filters-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                Clear All Filters
              </button>
            </div>
          </aside>
          <div class="products-container">
            <div class="products-toolbar">
              <div class="toolbar-left">
                <div class="search-box">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input
                    type="text"
                    placeholder="Search products..."
                    class="ng-valid ng-dirty ng-touched"
                  />
                </div>
              </div>
              <div class="toolbar-right">
                <span class="results-count">40 products</span>
                <button class="sort-by-button">Sort by</button>
              </div>
            </div>
            <div class="products-grid"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer-default">
      <a target="_blank" href="https://github.com/saba-crypto" class="logo"
        ><span class="logo-text">Created by Saba himself</span></a
      >
    </footer>
    <script type="module" src="../scripts/paged/shop/shop.js"></script>
  </body>
</html>
