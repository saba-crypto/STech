<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>STech</title>
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("colorTheme") || "light"
      );
    </script>
    <link
      rel="stylesheet"
      href="../styles/main.css" />
    <link
      rel="stylesheet"
      href="../styles/pages/shop/shop.css" />
  </head>
  <body>
    <header class="header"></header>
    <main>
      <section id="section1">
        <div class="section-container">
          <div class="header-content">
            <nav
              class="breadcrumb"
              aria-label="Breadcrumb">
              <a href="../index.html">Home</a>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
              <span>Shop</span>
            </nav>
            <h1 class="page-heading">All Products</h1>
            <p class="page-description">
              Discover our full range of tech products
            </p>
          </div>
        </div>
      </section>
      <section id="section2">
        <div
          class="filters-overlay"
          aria-hidden="true"></div>
        <div class="section-container">
          <aside
            class="filter-sidebar"
            aria-label="Product filters">
            <div class="sidebar-header">
              <h2>Filters</h2>
              <button
                class="close-filters"
                type="button"
                aria-label="Close filters">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
                  <line
                    x1="18"
                    y1="6"
                    x2="6"
                    y2="18"></line>
                  <line
                    x1="6"
                    y1="6"
                    x2="18"
                    y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="filters-content">
              <fieldset class="filter-group">
                <legend class="filter-title">Categories</legend>
                <div class="filter-options categories"></div>
              </fieldset>
              <fieldset class="filter-group">
                <legend class="filter-title">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true">
                    <polygon
                      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                  Min Rating
                </legend>
                <div
                  class="rating-options"
                  role="group"
                  aria-label="Minimum star rating filter">
                  <button
                    data-min-rating="4"
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 4 and up">
                    <span
                      class="stars-display"
                      aria-hidden="true">
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star">★</span>
                    </span>
                    <span class="rating-text">4 &amp; up</span>
                  </button>
                  <button
                    data-min-rating="3"
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 3 and up">
                    <span
                      class="stars-display"
                      aria-hidden="true">
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                    </span>
                    <span class="rating-text">3 &amp; up</span>
                  </button>
                  <button
                    data-min-rating="2"
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 2 and up">
                    <span
                      class="stars-display"
                      aria-hidden="true">
                      <span class="star star-filled">★</span>
                      <span class="star star-filled">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                    </span>
                    <span class="rating-text">2 &amp; up</span>
                  </button>
                  <button
                    data-min-rating="1"
                    type="button"
                    class="rating-option"
                    aria-pressed="false"
                    aria-label="Minimum rating: 1 and up">
                    <span
                      class="stars-display"
                      aria-hidden="true">
                      <span class="star star-filled">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                      <span class="star">★</span>
                    </span>
                    <span class="rating-text">1 &amp; up</span>
                  </button>
                </div>
              </fieldset>
              <fieldset class="filter-group">
                <legend class="filter-title">Price Range</legend>
                <div class="price-inputs">
                  <div class="price-input">
                    <div class="price-label">Min</div>
                    <input
                      class="min-price-input"
                      id="price-min"
                      type="number"
                      placeholder="$0"
                      min="0" />
                  </div>
                  <span class="price-separator">-</span>
                  <div class="price-input">
                    <div class="price-label">Max</div>
                    <input
                      class="max-price-input"
                      id="price-max"
                      type="number"
                      placeholder="$9999"
                      min="0" />
                  </div>
                </div>
              </fieldset>
              <fieldset class="filter-group">
                <legend class="filter-title">Brand</legend>
                <div class="filter-search">
                  <input
                    class="brand-input"
                    id="brand-search"
                    type="text"
                    placeholder="Search brands..." />
                </div>
              </fieldset>
              <fieldset class="filter-group">
                <legend class="filter-title">Availability</legend>
                <div class="filter-option checkbox in-stock-container">
                  <input
                    class="in-stock-input"
                    type="checkbox"
                    name="in-stock" />
                  <span class="checkbox-mark"></span>
                  <span class="option-label">In Stock Only</span>
                </div>
              </fieldset>
              <button
                class="clear-filters-btn"
                type="button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                Clear All Filters
              </button>
            </div>
          </aside>
          <div class="products-container">
            <div class="products-toolbar">
              <div class="toolbar-left">
                <button
                  class="filter-toggle"
                  type="button">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <line
                      x1="4"
                      y1="21"
                      x2="4"
                      y2="14"></line>
                    <line
                      x1="4"
                      y1="10"
                      x2="4"
                      y2="3"></line>
                    <line
                      x1="12"
                      y1="21"
                      x2="12"
                      y2="12"></line>
                    <line
                      x1="12"
                      y1="8"
                      x2="12"
                      y2="3"></line>
                    <line
                      x1="20"
                      y1="21"
                      x2="20"
                      y2="16"></line>
                    <line
                      x1="20"
                      y1="12"
                      x2="20"
                      y2="3"></line>
                    <line
                      x1="1"
                      y1="14"
                      x2="7"
                      y2="14"></line>
                    <line
                      x1="9"
                      y1="8"
                      x2="15"
                      y2="8"></line>
                    <line
                      x1="17"
                      y1="16"
                      x2="23"
                      y2="16"></line>
                  </svg>
                  <span>Filters</span>
                  <span
                    class="filter-badge"
                    style="display: none"
                    >0</span
                  >
                </button>
                <div class="search-box">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <circle
                      cx="11"
                      cy="11"
                      r="8"></circle>
                    <line
                      x1="21"
                      y1="21"
                      x2="16.65"
                      y2="16.65"></line>
                  </svg>
                  <input
                    class="shop-search-input"
                    id="shop-search"
                    type="text"
                    placeholder="Search products..." />
                  <button
                    class="clear-search"
                    type="button"
                    aria-label="Clear search"
                    style="display: none">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true">
                      <line
                        x1="18"
                        y1="6"
                        x2="6"
                        y2="18"></line>
                      <line
                        x1="6"
                        y1="6"
                        x2="18"
                        y2="18"></line>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="toolbar-right">
                <span class="results-count">40 products</span>
                <select
                  id="sort-by"
                  class="sort-select">
                  <option
                    disabled
                    selected
                    value="">
                    sort by
                  </option>
                  <option
                    value="price"
                    class="sort-option">
                    Price: Low to High
                  </option>
                  <option
                    value="price descending"
                    class="sort-option">
                    Price: High to Low
                  </option>
                  <option
                    value="name"
                    class="sort-option">
                    Name: A-Z
                  </option>
                  <option
                    value="rating descending"
                    class="sort-option">
                    Top Rated
                  </option>
                  <option
                    value="createdAt descending"
                    class="sort-option">
                    Newest
                  </option>
                </select>
              </div>
            </div>
            <div
              class="active-filters"
              aria-label="Active filters"></div>
            <div class="products-grid"></div>
            <nav
              class="pagination"
              aria-label="Product pages">
              <div class="pagination-list">
                <button
                  class="pagination-btn pagination-previous"
                  type="button"
                  aria-label="Previous page">
                  ‹
                </button>
                <div class="pagination-nav-btns"></div>
                <button
                  class="pagination-btn pagination-next"
                  type="button"
                  aria-label="Next page">
                  ›
                </button>

                <select
                  id="page-size"
                  class="page-size-select">
                  <option
                    value="8"
                    selected>
                    8 / page
                  </option>
                  <option value="12">12 / page</option>
                  <option value="24">24 / page</option>
                  <option value="48">48 / page</option>
                </select>
              </div>
            </nav>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer-default">
      <a
        target="_blank"
        href="https://github.com/saba-crypto"
        class="logo"
        ><span class="logo-text">Created by Saba himself</span></a
      >
    </footer>
    <script
      type="module"
      src="../scripts/paged/shop/shop.js"></script>
  </body>
</html>
